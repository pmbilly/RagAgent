# 测试专用：契约/单元测试不依赖外部 postgres/redis
spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  data:
    redis:
      host: localhost
      port: 16379

# 骨架阶段无 MyBatis mapper；后续 mapper 测试再加 @MybatisPlusTest 专属配置
logging:
  level:
    com.ragagent: WARN
