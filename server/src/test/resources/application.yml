# 测试专用：契约/单元测试不依赖外部 postgres/redis
spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  data:
    redis:
      host: localhost
      port: 16379

weknora:
  storage:
    local-base-dir: ./build/test-files   # 测试期本地文件落点（KB 文档上传）

logging:
  level:
    com.ragagent: WARN
