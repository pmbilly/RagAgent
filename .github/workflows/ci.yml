# CI 起步三样：build / test / Spotless（HANDOFF §8；ArchUnit 规则留阶段 4）。
# 测试自含（契约 fixture，无 Testcontainers），无需起服务容器。
# 2026-09-30 增：包结构守卫（环 / 分层棘轮，scripts/check-package-cycles.py）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: 包结构守卫（环 / 分层棘轮）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 环与分层违例只许减不许增
        run: python3 scripts/check-package-cycles.py

  backend:
    name: 后端 build + test + spotless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # spotless ratchetFrom('seed') 需要基线 tag 可达
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Spotless check（ratchet 自 seed，仅检查触碰过的文件）
        run: ./gradlew spotlessCheck
      - name: Build & test
        run: ./gradlew build

  frontend:
    name: 前端 type-check + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build-only
